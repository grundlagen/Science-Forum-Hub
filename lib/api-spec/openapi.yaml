openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SciVet API — citizen science papers, AI rigor checks, community reviews
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: papers
    description: Scientific paper submissions
  - name: reviews
    description: Community reviews and votes
  - name: comments
    description: Threaded critiques on papers
  - name: feed
    description: Discovery feeds and aggregates
  - name: fields
    description: Scientific field taxonomy
  - name: users
    description: User profiles
  - name: focus
    description: Focus Guard — psychology-grounded deep-work sessions and attention guard rails
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Current authenticated user (or null if signed out)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /fields:
    get:
      operationId: listFields
      tags: [fields]
      summary: List scientific field tags with paper counts
      responses:
        "200":
          description: Fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldTag"

  /papers:
    get:
      operationId: listPapers
      tags: [papers]
      summary: List papers (filterable)
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            type: string
            enum: [draft, under_review, promoted, published, all]
        - name: field
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [trending, recent, top]
        - name: authorId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Papers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperSummary"
    post:
      operationId: createPaper
      tags: [papers]
      summary: Submit a new paper (auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperCreateInput"
      responses:
        "201":
          description: Created paper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /papers/{id}:
    get:
      operationId: getPaper
      tags: [papers]
      summary: Get a paper with full content, AI report, vote breakdown, and counts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paper detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
    patch:
      operationId: updatePaper
      tags: [papers]
      summary: Revise a paper (author only). Triggers a fresh AI rigor pass.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperUpdateInput"
      responses:
        "200":
          description: Updated paper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /papers/{id}/revisions:
    get:
      operationId: listPaperRevisions
      tags: [papers]
      summary: Revision history for a paper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperRevision"

  /papers/{id}/rerun-ai:
    post:
      operationId: rerunPaperAi
      tags: [papers]
      summary: Manually trigger a fresh AI rigor + survey pass (author only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated paper with fresh AI reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /papers/{id}/comments:
    get:
      operationId: listPaperComments
      tags: [comments]
      summary: List threaded critiques on a paper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createPaperComment
      tags: [comments]
      summary: Post a critique or reply (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /papers/{id}/reviews:
    get:
      operationId: listPaperReviews
      tags: [reviews]
      summary: List structured reviews/votes on a paper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: castPaperReview
      tags: [reviews]
      summary: Cast or update an endorse/challenge/reject vote with required justification (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCastInput"
      responses:
        "201":
          description: Created or updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /feed/trending:
    get:
      operationId: getTrendingFeed
      tags: [feed]
      summary: Trending papers across the platform
      responses:
        "200":
          description: Trending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperSummary"

  /feed/promoted:
    get:
      operationId: getPromotedFeed
      tags: [feed]
      summary: Recently promoted papers
      responses:
        "200":
          description: Promoted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperSummary"

  /feed/published:
    get:
      operationId: getPublishedFeed
      tags: [feed]
      summary: Recently published papers
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperSummary"

  /feed/stats:
    get:
      operationId: getFeedStats
      tags: [feed]
      summary: Platform-wide stats for the homepage
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedStats"

  /users/{id}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Public profile with submitted papers and review history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /focus/preferences:
    get:
      operationId: getFocusPreferences
      tags: [focus]
      summary: Get the current user's Focus Guard preferences (creates defaults on first read)
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusPreferences"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
    put:
      operationId: updateFocusPreferences
      tags: [focus]
      summary: Update Focus Guard preferences (auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusPreferencesInput"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusPreferences"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /focus/sessions:
    get:
      operationId: listFocusSessions
      tags: [focus]
      summary: List the current user's focus sessions, most recent first (auth required)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, completed, abandoned, expired, all]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
    post:
      operationId: startFocusSession
      tags: [focus]
      summary: Start a new focus session (auth required). Fails if one is already active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionStartInput"
      responses:
        "201":
          description: Started session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409":
          description: A session is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /focus/sessions/active:
    get:
      operationId: getActiveFocusSession
      tags: [focus]
      summary: The current user's active session, or null (auth required)
      responses:
        "200":
          description: Active session wrapper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveFocusSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /focus/sessions/{id}:
    get:
      operationId: getFocusSession
      tags: [focus]
      summary: Get one of the current user's focus sessions (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
    patch:
      operationId: updateFocusSessionProgress
      tags: [focus]
      summary: Heartbeat — advance focused time, goal progress, breaks (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionProgressInput"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409":
          description: Session is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /focus/sessions/{id}/distractions:
    post:
      operationId: parkFocusDistraction
      tags: [focus]
      summary: Park a distraction to the session's parking lot (Zeigarnik offload, auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistractionInput"
      responses:
        "200":
          description: Session with the parked distraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /focus/sessions/{id}/complete:
    post:
      operationId: completeFocusSession
      tags: [focus]
      summary: Complete a session with optional reflection and flow rating (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionCompleteInput"
      responses:
        "200":
          description: Completed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /focus/sessions/{id}/abandon:
    post:
      operationId: abandonFocusSession
      tags: [focus]
      summary: Abandon an active session early (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Abandoned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

  /focus/stats:
    get:
      operationId: getFocusStats
      tags: [focus]
      summary: Aggregate focus stats, streaks, and a psychology-grounded insight (auth required)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiErrorBody:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/PublicUser"
            - type: "null"
      required:
        - user

    PublicUser:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - avatarUrl
        - bio
        - createdAt

    UserProfile:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        papers:
          type: array
          items:
            $ref: "#/components/schemas/PaperSummary"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        stats:
          $ref: "#/components/schemas/UserStats"
      required:
        - user
        - papers
        - reviews
        - stats

    UserStats:
      type: object
      properties:
        papersSubmitted:
          type: integer
        papersPublished:
          type: integer
        reviewsCast:
          type: integer
        commentsPosted:
          type: integer
      required:
        - papersSubmitted
        - papersPublished
        - reviewsCast
        - commentsPosted

    FieldTag:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        paperCount:
          type: integer
      required:
        - slug
        - name
        - paperCount

    PaperStage:
      type: string
      enum: [draft, under_review, promoted, published]

    ReviewStance:
      type: string
      enum: [endorse, challenge, reject]

    PaperSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        abstract:
          type: string
        fields:
          type: array
          items:
            type: string
        stage:
          $ref: "#/components/schemas/PaperStage"
        author:
          $ref: "#/components/schemas/PublicUser"
        rigorScore:
          type: ["number", "null"]
        aiConfidence:
          type: ["number", "null"]
        endorseCount:
          type: integer
        challengeCount:
          type: integer
        rejectCount:
          type: integer
        commentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - abstract
        - fields
        - stage
        - author
        - rigorScore
        - aiConfidence
        - endorseCount
        - challengeCount
        - rejectCount
        - commentCount
        - createdAt
        - updatedAt

    Paper:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        abstract:
          type: string
        body:
          type: string
        fields:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            $ref: "#/components/schemas/PaperReference"
        stage:
          $ref: "#/components/schemas/PaperStage"
        authorId:
          type: string
        revisionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - abstract
        - body
        - fields
        - references
        - stage
        - authorId
        - revisionCount
        - createdAt
        - updatedAt

    PaperReference:
      type: object
      properties:
        citation:
          type: string
        url:
          type: ["string", "null"]
      required:
        - citation
        - url

    PaperDetail:
      type: object
      properties:
        paper:
          $ref: "#/components/schemas/Paper"
        author:
          $ref: "#/components/schemas/PublicUser"
        rigorReport:
          oneOf:
            - $ref: "#/components/schemas/RigorReport"
            - type: "null"
        aiSurvey:
          oneOf:
            - $ref: "#/components/schemas/AiSurvey"
            - type: "null"
        voteBreakdown:
          $ref: "#/components/schemas/VoteBreakdown"
        commentCount:
          type: integer
        promotionThresholds:
          $ref: "#/components/schemas/PromotionThresholds"
      required:
        - paper
        - author
        - rigorReport
        - aiSurvey
        - voteBreakdown
        - commentCount
        - promotionThresholds

    RigorReport:
      type: object
      properties:
        overallScore:
          type: number
        logicScore:
          type: number
        methodologyScore:
          type: number
        citationsScore:
          type: number
        falsifiabilityScore:
          type: number
        noveltyScore:
          type: number
        critique:
          type: string
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - overallScore
        - logicScore
        - methodologyScore
        - citationsScore
        - falsifiabilityScore
        - noveltyScore
        - critique
        - strengths
        - weaknesses
        - createdAt

    AiSurvey:
      type: object
      properties:
        confidence:
          type: number
        passes:
          type: array
          items:
            $ref: "#/components/schemas/AiSurveyPass"
        consensus:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - confidence
        - passes
        - consensus
        - createdAt

    AiSurveyPass:
      type: object
      properties:
        persona:
          type: string
        verdict:
          type: string
          enum: [endorse, mixed, reject]
        confidence:
          type: number
        rationale:
          type: string
      required:
        - persona
        - verdict
        - confidence
        - rationale

    VoteBreakdown:
      type: object
      properties:
        endorse:
          type: integer
        challenge:
          type: integer
        reject:
          type: integer
        communityScore:
          type: number
        combinedScore:
          type: number
      required:
        - endorse
        - challenge
        - reject
        - communityScore
        - combinedScore

    PromotionThresholds:
      type: object
      properties:
        underReview:
          type: number
        promoted:
          type: number
        published:
          type: number
      required:
        - underReview
        - promoted
        - published

    PaperRevision:
      type: object
      properties:
        id:
          type: integer
        paperId:
          type: integer
        revisionNumber:
          type: integer
        title:
          type: string
        abstract:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - paperId
        - revisionNumber
        - title
        - abstract
        - summary
        - createdAt

    Comment:
      type: object
      properties:
        id:
          type: integer
        paperId:
          type: integer
        parentId:
          type: ["integer", "null"]
        author:
          $ref: "#/components/schemas/PublicUser"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - paperId
        - parentId
        - author
        - body
        - createdAt

    Review:
      type: object
      properties:
        id:
          type: integer
        paperId:
          type: integer
        author:
          $ref: "#/components/schemas/PublicUser"
        stance:
          $ref: "#/components/schemas/ReviewStance"
        justification:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - paperId
        - author
        - stance
        - justification
        - createdAt

