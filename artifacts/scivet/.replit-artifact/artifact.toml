kind = "web"
previewPath = "/"
title = "SciVet"
version = "1.0.0"
id = "artifacts/scivet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24128

[services.development]
run = "pnpm --filter @workspace/scivet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scivet", "run", "build" ]
publicDir = "artifacts/scivet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24128"
BASE_PATH = "/"
